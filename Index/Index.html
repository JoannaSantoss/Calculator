<!DOCTYPE html>
<html lang="pt-BR">
  <!-- This repository has Portuguese comments only. Feel free to translate or improve them. -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <!-- Conectando o CSS com o HTML. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculadora</h1>
    </header>
    <main>
<!-- Criação do id calculadora. -->
  <div id="calculadora">
    <input id="visor" type="text" value="" placeholder="0" readonly>
 
<!-- Criação da classe teclado. -->
    <div class="teclado">
      <button class="btn function" value="CE">CE</button>
      <button class="btn function" value="DEL">DEL</button>
      <button class="btn operator" value="/">/</button>
      <button class="btn operator" value="*">X</button>

      <button class="btn" value="7">7</button>
      <button class="btn" value="8">8</button>
      <button class="btn" value="9">9</button>
      <button class="btn operator" value="-">-</button>

      <button class="btn" value="4">4</button>
      <button class="btn" value="5">5</button>
      <button class="btn" value="6">6</button>
      <button class="btn operator" value="+">+</button>

      <button class="btn" value="1">1</button>
      <button class="btn" value="2">2</button>
      <button class="btn" value="3">3</button>
      <button class="btn function" value="=">=</button>

      <button class="btn zero" value="0">0</button>
    </div>
  </div>
  </main>


<!-- Conexão do JavaScript Com o HTML. -->
  <script src="script.js"></script>

</body>
</html>
